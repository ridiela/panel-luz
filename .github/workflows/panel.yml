name: Panel luz (precios PVPC)

on:
  schedule:
    # GitHub usa hora UTC. REE publica los precios de mañana hacia las 20:15 (hora de Madrid).
    - cron: "40 18 * * *"
    - cron: "40 19 * * *"
    - cron: "40 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias y fuente
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          mkdir -p ~/.local/share/fonts
          find . -name '*.otf' -exec cp {} ~/.local/share/fonts/ \;
          fc-cache -f

      - name: Descargar precios y dibujar pantallas
        run: python generar.py --salida _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub desactiva las tareas programadas tras 60 días sin actividad.
      - name: Mantener activa la tarea programada
        if: github.event_name == 'schedule'
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantener activa la tarea programada"
            git push
          fi

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
